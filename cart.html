<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>سلة التسوق - موسى الأسود للأثاث</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .cart-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            margin: 40px 0;
        }
        
        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s;
        }
        
        .cart-item:hover {
            transform: translateX(-5px);
        }
        
        .cart-item img {
            width: 120px;
            height: 100px;
            object-fit: cover;
            border-radius: 15px;
            border: 2px solid #C6A43F;
        }
        
        .item-details {
            flex: 1;
        }
        
        .item-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .item-price {
            color: #C6A43F;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .item-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .item-actions input {
            width: 70px;
            padding: 8px;
            border: 2px solid #eee;
            border-radius: 8px;
            text-align: center;
        }
        
        .btn-remove {
            background: none;
            border: none;
            color: #f44336;
            cursor: pointer;
            font-size: 14px;
            padding: 5px 10px;
            border-radius: 5px;
            transition: all 0.3s;
        }
        
        .btn-remove:hover {
            background: #f44336;
            color: white;
        }
        
        .item-total {
            font-size: 18px;
            font-weight: bold;
            color: #1E1E1E;
            min-width: 100px;
            text-align: left;
        }
        
        .cart-summary {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            position: sticky;
            top: 100px;
            height: fit-content;
        }
        
        .summary-title {
            font-size: 22px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            color: #666;
        }
        
        .summary-total {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
            padding-top: 20px;
            border-top: 2px solid #eee;
            font-size: 20px;
            font-weight: bold;
            color: #1E1E1E;
        }
        
        .whatsapp-btn {
            background: #25D366;
            color: white;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 15px;
        }
        
        .whatsapp-btn:hover {
            background: #128C7E;
        }
        
        .continue-shopping {
            display: block;
            text-align: center;
            color: #666;
            text-decoration: none;
            margin-top: 15px;
        }
        
        .continue-shopping:hover {
            color: #C6A43F;
        }
        
        .empty-cart {
            text-align: center;
            padding: 100px 20px;
            background: white;
            border-radius: 30px;
        }
        
        .empty-cart svg {
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        @media (max-width: 768px) {
            .cart-container {
                grid-template-columns: 1fr;
            }
            
            .cart-item {
                flex-direction: column;
                text-align: center;
            }
            
            .item-total {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="container">
        <h1 style="text-align: center; margin: 40px 0;">سلة التسوق</h1>
        
        <div class="cart-container">
            <div id="cart-items" class="cart-items"></div>
            
            <div class="cart-summary" id="cartSummary">
                <h3 class="summary-title">ملخص الطلب</h3>
                <div id="summaryDetails"></div>
            </div>
        </div>
    </div>

    <div class="footer-line">
        © 2025 MUSA AL-ASWAD FURNITURE – Programming and design by MOHAMEDALI
    </div>

    <script src="common.js"></script>
    <script>
        function renderCart() {
            const cart = getCart();
            const products = getProducts();
            const container = document.getElementById('cart-items');
            const summaryContainer = document.getElementById('summaryDetails');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <svg viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1">
                            <circle cx="9" cy="21" r="1.5" fill="#ccc"/>
                            <circle cx="20" cy="21" r="1.5" fill="#ccc"/>
                            <path d="M1 1h4l2.5 13h13L23 5H5" stroke="#ccc" stroke-linecap="round"/>
                        </svg>
                        <h2>السلة فارغة</h2>
                        <p style="color: #666; margin: 20px 0;">أضف بعض المنتجات الرائعة إلى سلتك</p>
                        <a href="products.html" class="btn">تسوق الآن</a>
                    </div>
                `;
                summaryContainer.innerHTML = '';
                return;
            }

            let html = '';
            let subtotal = 0;
            
            cart.forEach(item => {
                const product = products.find(p => p.id === item.id);
                const itemTotal = item.price * item.qty;
                subtotal += itemTotal;
                
                html += `
                    <div class="cart-item" data-id="${item.id}">
                        <img src="${item.img}" alt="${item.title}" onerror="this.src='images/placeholder.jpg'">
                        <div class="item-details">
                            <div class="item-title">${item.title}</div>
                            <div class="item-price">${item.price} ج.م</div>
                            <div class="item-actions">
                                <input type="number" min="1" max="${product ? product.qty : item.qty}" 
                                    value="${item.qty}" class="item-qty" onchange="updateQuantity(${item.id}, this.value)">
                                <button class="btn-remove" onclick="removeItem(${item.id})">
                                    🗑️ حذف
                                </button>
                            </div>
                        </div>
                        <div class="item-total">
                            ${itemTotal} ج.م
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            
            // حساب الضريبة والإجمالي
            const shipping = subtotal > 0 ? (subtotal >= 2000 ? 0 : 50) : 0;
            const tax = subtotal * 0.14; // 14% ضريبة
            const total = subtotal + shipping + tax;
            
            summaryContainer.innerHTML = `
                <div class="summary-row">
                    <span>المجموع الفرعي:</span>
                    <span>${subtotal} ج.م</span>
                </div>
                <div class="summary-row">
                    <span>الضريبة (14%):</span>
                    <span>${tax.toFixed(2)} ج.م</span>
                </div>
                <div class="summary-row">
                    <span>الشحن:</span>
                    <span>${shipping === 0 ? 'مجاني' : shipping + ' ج.م'}</span>
                </div>
                <div class="summary-total">
                    <span>الإجمالي:</span>
                    <span>${total.toFixed(2)} ج.م</span>
                </div>
                <button class="whatsapp-btn" onclick="sendWhatsApp()">
                    📱 إرسال الطلب عبر واتساب
                </button>
                <a href="products.html" class="continue-shopping">← متابعة التسوق</a>
            `;
        }

        function updateQuantity(id, newQty) {
            if (updateCartItemQuantity(id, parseInt(newQty))) {
                renderCart();
            }
        }

        function removeItem(id) {
            if (confirm('هل أنت متأكد من حذف هذا المنتج من السلة؟')) {
                removeFromCart(id);
                renderCart();
            }
        }

        function sendWhatsApp() {
            const cart = getCart();
            if (cart.length === 0) {
                showNotification('السلة فارغة', 'warning');
                return;
            }
            
            let message = '🛒 *طلب جديد من موسى الأسود للأثاث*\n\n';
            let total = 0;
            
            cart.forEach(item => {
                const itemTotal = item.price * item.qty;
                message += `🔹 *${item.title}*\n`;
                message += `   ${item.qty} × ${item.price} ج.م = ${itemTotal} ج.م\n\n`;
                total += itemTotal;
            });
            
            const tax = total * 0.14;
            const shipping = total >= 2000 ? 0 : 50;
            const finalTotal = total + tax + shipping;
            
            message += `📊 *ملخص الفواتير*\n`;
            message += `المجموع: ${total} ج.م\n`;
            message += `الضريبة: ${tax.toFixed(2)} ج.م\n`;
            message += `الشحن: ${shipping === 0 ? 'مجاني' : shipping + ' ج.م'}\n`;
            message += `*الإجمالي النهائي: ${finalTotal.toFixed(2)} ج.م*\n\n`;
            
            message += `👤 *بيانات العميل*\n`;
            message += `الاسم: [يرجى الإرسال]\n`;
            message += `العنوان: [يرجى الإرسال]\n`;
            message += `التليفون: [يرجى الإرسال]\n\n`;
            
            message += `شكراً لتسوقكم معنا ❤️`;
            
            const phone = '201276231298'; // بدون + أو 00
            const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        renderCart();
    </script>
</body>
</html>
