<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>تفاصيل المنتج - موسى الأسود للأثاث</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .product-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin: 40px 0;
        }
        
        .product-image {
            position: relative;
        }
        
        .product-image img {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .product-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #C6A43F;
            color: white;
            padding: 8px 15px;
            border-radius: 30px;
            font-weight: bold;
        }
        
        .product-title {
            font-size: 36px;
            color: #1E1E1E;
            margin-bottom: 20px;
        }
        
        .product-price {
            font-size: 32px;
            color: #C6A43F;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .product-desc {
            font-size: 16px;
            line-height: 1.8;
            color: #555;
            margin-bottom: 30px;
        }
        
        .product-meta {
            background: #F8F6F4;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        
        .meta-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .quantity-selector {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .quantity-selector input {
            width: 100px;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .action-buttons .btn {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            min-width: 200px;
        }
        
        .related-products {
            margin-top: 60px;
        }
        
        .related-products h3 {
            font-size: 24px;
            margin-bottom: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="container">
        <div id="productContainer"></div>
        
        <div class="related-products">
            <h3>منتجات قد تعجبك</h3>
            <div class="products-grid" id="relatedProducts"></div>
        </div>
    </div>

    <a href="cart.html" class="cart-bar">
        🛒 السلة (<span class="cart-count">0</span>)
    </a>

    <div class="footer-line">
        © 2025 MUSA AL-ASWAD FURNITURE – تصميم وبرمجة محمد علي
    </div>

    <script src="common.js"></script>
    <script>
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return parseInt(urlParams.get(name));
        }

        function renderProduct() {
            const productId = getQueryParam('id');
            const products = getProducts();
            const product = products.find(p => p.id === productId);
            const container = document.getElementById('productContainer');

            if (!product) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 100px 20px;">
                        <h2>المنتج غير موجود</h2>
                        <p>عذراً، لم نتمكن من العثور على المنتج المطلوب</p>
                        <a href="products.html" class="btn" style="margin-top: 20px;">العودة للمتجر</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="product-details">
                    <div class="product-image">
                        <img src="${product.img}" alt="${product.title}" onerror="this.src='images/placeholder.jpg'">
                        <div class="product-badge">متوفر</div>
                    </div>
                    <div class="product-info">
                        <h1 class="product-title">${product.title}</h1>
                        <div class="product-price">${product.price} ج.م</div>
                        <p class="product-desc">${product.desc}</p>
                        
                        <div class="product-meta">
                            <div class="meta-item">
                                <span style="font-weight: bold;">✅ الكمية المتاحة:</span>
                                <span>${product.qty} قطعة</span>
                            </div>
                            <div class="meta-item">
                                <span style="font-weight: bold;">🏷️ الموديل:</span>
                                <span>${product.id}</span>
                            </div>
                            <div class="meta-item">
                                <span style="font-weight: bold;">⭐ التقييم:</span>
                                <span>★★★★★ (5/5)</span>
                            </div>
                        </div>
                        
                        <div class="quantity-selector">
                            <label style="font-weight: bold;">الكمية:</label>
                            <input type="number" id="productQty" min="1" max="${product.qty}" value="1">
                        </div>
                        
                        <div class="action-buttons">
                            <button class="btn" onclick="addToCart(${product.id}, parseInt(document.getElementById('productQty').value))">
                                🛒 أضف إلى السلة
                            </button>
                            <button class="btn alt" onclick="buyNow(${product.id})">
                                ⚡ شراء الآن
                            </button>
                        </div>
                        
                        <div style="margin-top: 30px; padding-top: 20px; border-top: 2px dashed #eee;">
                            <h4>مميزات المنتج:</h4>
                            <ul style="list-style: none; padding: 0;">
                                <li style="margin: 10px 0;">✓ خامات عالية الجودة</li>
                                <li style="margin: 10px 0;">✓ ضمان لمدة عام</li>
                                <li style="margin: 10px 0;">✓ توصيل سريع وآمن</li>
                                <li style="margin: 10px 0;">✓ إمكانية الاستبدال خلال 7 أيام</li>
                            </ul>
                        </div>
                    </div>
                </div>
            `;

            // عرض منتجات ذات صلة
            const related = products.filter(p => p.id !== productId).slice(0, 3);
            const relatedContainer = document.getElementById('relatedProducts');
            
            if (related.length > 0) {
                relatedContainer.innerHTML = '';
                related.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${p.img}" alt="${p.title}">
                        <div class="body">
                            <h3>${p.title}</h3>
                            <div class="price">${p.price} ج.م</div>
                            <a href="product.html?id=${p.id}" class="btn">عرض التفاصيل</a>
                        </div>
                    `;
                    relatedContainer.appendChild(card);
                });
            }
        }

        function buyNow(productId) {
            const qty = parseInt(document.getElementById('productQty').value);
            addToCart(productId, qty);
            setTimeout(() => {
                window.location.href = 'cart.html';
            }, 1000);
        }

        renderProduct();
    </script>
</body>
</html>
