<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>المتجر - موسى الأسود للأثاث</title>
    <meta name="description" content="تسوق أفضل الأثاث والستائر العصرية من موسى الأسود - جودة عالية وأسعار مناسبة">
    <link rel="stylesheet" href="style.css">
    <style>
        /* تنسيقات صفحة المتجر */
        .store-hero {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('images/store-bg.jpg');
            background-size: cover;
            background-position: center;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            margin-bottom: 30px;
            border-radius: 0 0 30px 30px;
        }
        
        .store-hero h1 {
            font-size: 36px;
            margin-bottom: 5px;
        }
        
        .store-hero p {
            font-size: 16px;
            opacity: 0.9;
        }
        
        /* شبكة المنتجات - بسيطة ونظيفة */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            margin: 30px 0 50px;
        }
        
        /* بطاقة المنتج - تصميم بسيط */
        .card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: all 0.3s;
            border: 1px solid #f0f0f0;
            position: relative;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }
        
        .card .image-wrapper {
            position: relative;
            height: 200px;
            overflow: hidden;
            background: #f9f9f9;
        }
        
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        
        .card:hover img {
            transform: scale(1.05);
        }
        
        .card-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #C6A43F;
            color: #1E1E1E;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            z-index: 2;
        }
        
        .card .body {
            padding: 15px;
        }
        
        .card h3 {
            font-size: 16px;
            margin-bottom: 5px;
            color: #1E1E1E;
            font-weight: 700;
        }
        
        .card .price {
            font-size: 18px;
            font-weight: 800;
            color: #C6A43F;
            margin-bottom: 10px;
        }
        
        .card .stock-status {
            font-size: 12px;
            margin-bottom: 12px;
            color: #4CAF50;
        }
        
        .card .stock-status.low-stock {
            color: #ff9800;
        }
        
        .card .stock-status.out-of-stock {
            color: #f44336;
        }
        
        .card .actions {
            display: flex;
            gap: 8px;
        }
        
        .card .btn {
            flex: 1;
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 25px;
            text-align: center;
        }
        
        .btn {
            background: #1E1E1E;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 8px 15px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        .btn:hover {
            background: #C6A43F;
            color: #1E1E1E;
        }
        
        .btn.alt {
            background: #C6A43F;
            color: #1E1E1E;
        }
        
        .btn.alt:hover {
            background: #1E1E1E;
            color: white;
        }
        
        /* محدد الكمية - بسيط */
        .quantity-input {
            width: 50px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 15px;
            padding: 5px;
            font-size: 13px;
        }
        
        /* صفحة فارغة */
        .empty-store {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 20px;
            margin: 40px 0;
        }
        
        /* شريط السلة العائم */
        .cart-bar {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #C6A43F;
            color: #1E1E1E;
            padding: 12px 20px;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            z-index: 99;
        }
        
        .cart-bar:hover {
            background: #1E1E1E;
            color: white;
        }
        
        /* عنوان الصفحة */
        .page-title {
            text-align: center;
            margin: 20px 0;
        }
        
        .page-title h2 {
            font-size: 24px;
            color: #1E1E1E;
            position: relative;
            display: inline-block;
            padding-bottom: 10px;
        }
        
        .page-title h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background: #C6A43F;
            border-radius: 3px;
        }
        
        /* تجاوب مع الجوال */
        @media (max-width: 768px) {
            .store-hero {
                height: 150px;
            }
            
            .store-hero h1 {
                font-size: 28px;
            }
            
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 15px;
            }
            
            .card .image-wrapper {
                height: 160px;
            }
            
            .card .actions {
                flex-direction: column;
            }
        }
        
        @media (max-width: 480px) {
            .products-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            
            .card .body {
                padding: 10px;
            }
            
            .card h3 {
                font-size: 14px;
            }
            
            .card .price {
                font-size: 16px;
            }
            
            .btn {
                padding: 6px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <!-- مكان إدراج الهيدر -->
    <div id="header-placeholder"></div>

    <!-- قسم الهيرو بسيط -->
    <section class="store-hero">
        <div class="container">
            <h1>🛒 المتجر</h1>
            <p>أحدث تشكيلات الأثاث والستائر</p>
        </div>
    </section>

    <div class="container">
        <!-- عنوان بسيط -->
        <div class="page-title">
            <h2>جميع المنتجات</h2>
        </div>

        <!-- شبكة المنتجات - تظهر علطول -->
        <section class="products-grid" id="productsList"></section>
    </div>

    <!-- شريط السلة العائم -->
    <a href="cart.html" class="cart-bar">
        🛒 السلة (<span class="cart-count">0</span>)
    </a>

    <!-- الفوتر -->
    <div class="footer-line">
        © 2025 MUSA AL-ASWAD FURNITURE – Programming and design by MOHAMED ALI
    </div>

    <script src="common.js"></script>
    <script>
        // ========== عرض المنتجات مباشرة بدون تعقيد ==========
        function renderProducts() {
            const products = getProducts(); // جلب المنتجات من localStorage
            const container = document.getElementById('productsList');
            
            // لو مفيش منتجات
            if (!products || products.length === 0) {
                container.innerHTML = `
                    <div class="empty-store">
                        <h3>لا توجد منتجات حالياً</h3>
                        <p>س نضيف منتجات جديدة قريباً</p>
                        <a href="index.html" class="btn">العودة للرئيسية</a>
                    </div>
                `;
                return;
            }

            // عرض المنتجات
            container.innerHTML = '';
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'card';
                
                // تحديد حالة الكمية
                let stockText = '';
                let stockClass = '';
                
                if (product.qty <= 0) {
                    stockText = '❌ غير متوفر';
                    stockClass = 'out-of-stock';
                } else if (product.qty < 5) {
                    stockText = `⏳ متبقي ${product.qty} فقط`;
                    stockClass = 'low-stock';
                } else {
                    stockText = '✅ متوفر';
                    stockClass = 'in-stock';
                }
                
                // بطاقة المنتج - تصميم بسيط
                card.innerHTML = `
                    <div class="image-wrapper">
                        <img src="${product.img}" alt="${product.title}" 
                             onerror="this.src='images/placeholder.jpg'">
                        ${product.qty < 5 && product.qty > 0 ? '<span class="card-badge">متبقي قليل</span>' : ''}
                    </div>
                    <div class="body">
                        <h3>${product.title}</h3>
                        <div class="price">${product.price} ج.م</div>
                        <div class="stock-status ${stockClass}">${stockText}</div>
                        <div class="actions">
                            ${product.qty > 0 ? `
                                <input type="number" id="qty-${product.id}" value="1" min="1" max="${product.qty}" 
                                       class="quantity-input" style="width:50px;">
                                <button class="btn" onclick="addToCartHandler(${product.id})">
                                    🛒 أضف
                                </button>
                            ` : `
                                <button class="btn" disabled style="opacity:0.5;">غير متوفر</button>
                            `}
                            <a href="product.html?id=${product.id}" class="btn alt">🔍 عرض</a>
                        </div>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        // ========== إضافة للسلة ==========
        function addToCartHandler(productId) {
            const qtyInput = document.getElementById(`qty-${productId}`);
            const qty = qtyInput ? parseInt(qtyInput.value) : 1;
            
            const products = getProducts();
            const product = products.find(p => p.id === productId);
            
            if (product && product.qty >= qty) {
                addToCart(productId, qty);
            } else {
                showNotification('الكمية المطلوبة غير متوفرة', 'error');
            }
        }

        // ========== تشغيل عند تحميل الصفحة ==========
        document.addEventListener('DOMContentLoaded', function() {
            renderProducts();
        });
    </script>
</body>
</html>
